global
  log stdout format raw local0 warning

defaults
  mode http
  timeout connect 1s
  timeout client 1h
  timeout server 1h
  default-server inter 1s fall 1 rise 1

# Stats page checked by the plugin.
frontend stats
  bind :8404
  stats enable
  stats uri /stats
  stats auth sensu:sensu-secret

# Healthy target for the servers below.
frontend target
  bind 127.0.0.1:9000
  http-request return status 200

# Holds every TCP connection open, to fill the session counters.
frontend sink
  mode tcp
  bind 127.0.0.1:9001
  tcp-request inspect-delay 1h
  tcp-request content accept if WAIT_END

backend web_ok
  server ok1 127.0.0.1:9000 check
  server ok2 127.0.0.1:9000 check

backend web_third
  server ok1 127.0.0.1:9000 check
  server ko1 127.0.0.1:1 check
  server ko2 127.0.0.1:1 check

backend web_down
  server ko1 127.0.0.1:1 check
  server ko2 127.0.0.1:1 check

backend web_maint
  server ok1 127.0.0.1:9000 check
  server off 127.0.0.1:9000 check disabled

# Sessions: one server limited to 10 connections, backend limit (slim) of 10.
frontend hold
  mode tcp
  bind 127.0.0.1:9100
  default_backend tcp_hold

backend tcp_hold
  mode tcp
  fullconn 10
  server sink 127.0.0.1:9001 maxconn 10
